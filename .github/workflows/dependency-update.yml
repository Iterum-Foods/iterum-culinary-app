name: Automated Dependency Updates

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Update npm dependencies
      run: |
        npm update
        npm audit fix || echo "Some audit fixes may require manual intervention"
        
    - name: Check for security vulnerabilities
      run: |
        npm audit --audit-level moderate || echo "Audit check completed with warnings"
      continue-on-error: true
        
    - name: Run tests with updated dependencies
      run: |
        npm ci
        npm test || echo "Tests may need updates for new dependency versions"
      continue-on-error: true
        
    - name: Check for changes
      id: check-changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Pull Request
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'Automated Dependency Updates'
        body: |
          ## Automated Dependency Updates
          
          This PR contains automated updates to project dependencies.
          
          ### Changes Made:
          - Updated npm packages to latest compatible versions
          - Applied security fixes from npm audit (where possible)
          
          ### Security Notes:
          - Security vulnerabilities have been addressed where possible
          - Some fixes may require manual intervention
          
          ### Testing:
          - Dependencies updated and installed
          - Please review and test thoroughly before merging
          
          **Note**: Please review the changes and test thoroughly before merging.
        branch: automated-dependency-updates
        delete-branch: true
        
    - name: Comment on PR
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:automated-dependency-updates`,
              state: 'open'
            });
            
            if (prs.length > 0) {
              await github.rest.issues.createComment({
                issue_number: prs[0].number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🤖 **Automated Dependency Update**
                
                This PR was created automatically by the dependency update workflow.
                
                ### Next Steps:
                1. Review the dependency changes
                2. Test the application locally
                3. Merge if everything looks good
                
                ### Dependencies Updated:
                - Check the file changes to see which packages were updated
                
                ### Security:
                - Security vulnerabilities have been addressed where possible
                - Some fixes may require manual review`
              });
            }
          } catch (error) {
            console.log('Could not comment on PR:', error.message);
          }
          
    - name: Notify on failure
      if: failure()
      run: |
        echo "⚠️ Dependency update workflow failed"
        echo "Check the workflow logs for details"
      # Slack notification removed - add back if SLACK_WEBHOOK_URL is configured
