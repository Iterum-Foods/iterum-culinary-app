name: Lint Code

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# v5 actions run on Node 24 (avoids Node 20 deprecation for checkout/setup-node)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Lint Summary
        if: always()
        run: |
          echo "## Lint results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ESLint** and **Prettier** must pass on \`main\` PRs" >> $GITHUB_STEP_SUMMARY

