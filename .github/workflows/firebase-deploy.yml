# Deploy Firebase Hosting, Firestore rules, and Storage rules when production assets change.
#
# Required repo secret:
#   FIREBASE_TOKEN — generate locally: npx firebase-tools login:ci
#   (Firebase Console → use an account with deploy permissions on project iterum-culinary-app2)
#
name: Deploy Firebase

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: firebase-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Deploy to Firebase
        run: npx firebase-tools@15.12.0 deploy --only "hosting,firestore:rules,storage" --project iterum-culinary-app2 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deployment summary
        if: success()
        run: |
          echo "## Firebase deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project**: iterum-culinary-app2" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Targets**: hosting, firestore:rules, storage" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
