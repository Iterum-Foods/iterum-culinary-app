name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify public directory exists
        run: |
          if [ ! -d "public" ]; then
            echo "Error: public directory not found"
            exit 1
          fi
          echo "✓ Public directory exists"
          echo ""
          echo "Checking key files in public folder:"
          if [ -f "public/index.html" ]; then
            echo "  ✓ public/index.html exists"
          else
            echo "  ⚠️ public/index.html NOT FOUND"
          fi
          if [ -f "public/landing.html" ]; then
            echo "  ✓ public/landing.html exists"
          else
            echo "  ⚠️ public/landing.html NOT FOUND"
          fi
          if [ -f "public/dashboard.html" ]; then
            echo "  ✓ public/dashboard.html exists"
          else
            echo "  ⚠️ public/dashboard.html NOT FOUND"
          fi
          if [ -d "public/assets" ]; then
            echo "  ✓ public/assets/ directory exists"
            echo "  Files in public/assets:"
            find public/assets -type f | head -10 | sed 's/^/    /'
          else
            echo "  ⚠️ public/assets/ directory NOT FOUND"
          fi
          echo ""
          echo "Total files in public folder:"
          find public -type f | wc -l
          echo ""
          echo "✓ Public directory structure verified - deploying from 'public' folder"
      
      - name: Create .nojekyll file
        run: |
          touch public/.nojekyll
          echo "✓ Created .nojekyll file to prevent Jekyll processing"

      - name: Verify Firebase configuration
        run: |
          if [ ! -f "firebase.json" ]; then
            echo "Error: firebase.json not found"
            exit 1
          fi
          if [ ! -f ".firebaserc" ]; then
            echo "Error: .firebaserc not found"
            exit 1
          fi
          echo "✓ Firebase configuration files verified"

      - name: Check Firebase token
        run: |
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "Error: FIREBASE_TOKEN secret is not set in GitHub repository settings"
            echo "Please set it at: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✓ Firebase token is configured"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Firebase CLI (compatible with Node 20)
        run: |
          npm install -g firebase-tools@15.0.0
          echo "✓ Firebase CLI installed"

      - name: Verify Firebase CLI
        run: |
          firebase --version
          node --version
          echo "✓ Versions verified"

      - name: Set Firebase Project
        run: |
          echo "Setting Firebase project to iterum-culinary-app2..."
          firebase use iterum-culinary-app2 --token "${{ secrets.FIREBASE_TOKEN }}" || {
            echo "❌ Failed to set Firebase project"
            exit 1
          }
          echo "✅ Project set to iterum-culinary-app2"

      - name: Verify Firebase Configuration
        run: |
          echo "Verifying Firebase configuration..."
          firebase use --token "${{ secrets.FIREBASE_TOKEN }}"
          echo "✅ Configuration verified"

      - name: List Firebase Hosting Sites
        run: |
          echo "Checking available hosting sites..."
          firebase hosting:sites:list --project iterum-culinary-app2 --token "${{ secrets.FIREBASE_TOKEN }}" || {
            echo "⚠️ Could not list sites (this is OK if sites don't exist yet)"
          }

      - name: Deploy to Firebase Landing Site
        run: |
          echo "🚀 Deploying to iterum-culinary-landing..."
          echo "Project: iterum-culinary-app2"
          echo "Site: iterum-culinary-landing"
          echo "Target: iterum-culinary-landing"
          echo "Public folder: public"
          echo ""
          echo "Deployment command:"
          echo "firebase deploy --only hosting:iterum-culinary-landing --project iterum-culinary-app2"
          echo ""
          firebase deploy --only hosting:iterum-culinary-landing --project iterum-culinary-app2 --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}" 2>&1 | tee deploy-landing.log || {
            echo ""
            echo "❌ Deployment to landing site failed"
            echo ""
            echo "Checking deployment log..."
            cat deploy-landing.log || echo "No log file created"
            echo ""
            echo "Possible causes:"
            echo "1. Site 'iterum-culinary-landing' does not exist in Firebase Console"
            echo "2. FIREBASE_TOKEN is invalid or expired"
            echo "3. Insufficient permissions"
            echo "4. Target configuration mismatch"
            echo ""
            echo "Checking Firebase project..."
            firebase projects:list --token "${{ secrets.FIREBASE_TOKEN }}" || echo "Cannot list projects - token may be invalid"
            exit 1
          }
          echo ""
          echo "✅ Landing site deployed successfully"
          echo "Check deployment log for details:"
          cat deploy-landing.log | grep -E "(files|deployed|hosting)" || echo "Log summary not available"

      - name: Deploy to Firebase App Site
        run: |
          echo "🚀 Deploying to iterum-culinary-app2..."
          echo "Project: iterum-culinary-app2"
          echo "Site: iterum-culinary-app2"
          echo "Target: iterum-culinary-app2"
          echo "Public folder: public"
          echo ""
          echo "Deployment command:"
          echo "firebase deploy --only hosting:iterum-culinary-app2 --project iterum-culinary-app2"
          echo ""
          firebase deploy --only hosting:iterum-culinary-app2 --project iterum-culinary-app2 --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}" 2>&1 | tee deploy-app.log || {
            echo ""
            echo "❌ Deployment to app site failed"
            echo ""
            echo "Checking deployment log..."
            cat deploy-app.log || echo "No log file created"
            echo ""
            echo "Possible causes:"
            echo "1. Site 'iterum-culinary-app2' does not exist in Firebase Console"
            echo "2. FIREBASE_TOKEN is invalid or expired"
            echo "3. Insufficient permissions"
            echo "4. Target configuration mismatch"
            echo ""
            echo "Checking Firebase project..."
            firebase projects:list --token "${{ secrets.FIREBASE_TOKEN }}" || echo "Cannot list projects - token may be invalid"
            exit 1
          }
          echo ""
          echo "✅ App site deployed successfully"
          echo "Check deployment log for details:"
          cat deploy-app.log | grep -E "(files|deployed|hosting)" || echo "Log summary not available"

      - name: Deployment Summary
        if: success()
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Landing Site**: https://iterum-culinary-landing.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- **App Site**: https://iterum-culinary-app2.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Error Summary
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Common Issues:" >> $GITHUB_STEP_SUMMARY
          echo "1. **FIREBASE_TOKEN**: Check if secret is set correctly in GitHub Settings > Secrets" >> $GITHUB_STEP_SUMMARY
          echo "2. **Project ID**: Verify Firebase project ID matches .firebaserc" >> $GITHUB_STEP_SUMMARY
          echo "3. **Sites**: Ensure sites exist in Firebase Console" >> $GITHUB_STEP_SUMMARY
          echo "4. **Permissions**: Check Firebase project permissions for the token" >> $GITHUB_STEP_SUMMARY
          echo "5. **Node.js**: Verify Node.js 20.x is being used" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Check the failed step's logs above for specific error message" >> $GITHUB_STEP_SUMMARY
          echo "- Verify FIREBASE_TOKEN is valid: Run \`firebase login:ci\` locally" >> $GITHUB_STEP_SUMMARY
          echo "- Check Firebase Console: https://console.firebase.google.com/project/iterum-culinary-app2/hosting" >> $GITHUB_STEP_SUMMARY

