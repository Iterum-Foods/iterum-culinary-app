# Deploy Firebase Firestore + Storage rules only.
# Production static hosting is on Vercel (see vercel.json); do not rely on Firebase Hosting for the app URL.
#
# Required repo secret:
#   FIREBASE_TOKEN — generate locally: npx firebase-tools login:ci
#
name: Deploy Firebase

on:
  push:
    branches: [main]
    paths:
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: firebase-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Deploy Firestore rules, indexes + Storage rules
        run: npx firebase-tools@15.12.0 deploy --only "firestore:rules,firestore:indexes,storage" --project iterum-culinary-app2 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deployment summary
        if: success()
        run: |
          echo "## Firebase rules deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project**: iterum-culinary-app2" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Targets**: firestore:rules, storage (hosting = Vercel)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
